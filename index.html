<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#37352f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #37352f;
      background: #fff;
    }

    #app {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 40px 80px;
    }
    @media (max-width: 600px) {
      #app { padding: 12px 16px 60px; }
    }
    @media (hover: none) {
      button:not(.item-del):not(.btn-tag-edit):not(.btn-title-edit):not(.btn-title-done):not(.btn-tag-save) {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      min-height: 36px;
    }

    .site-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #37352f;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sync-status {
      font-size: 12px;
      color: rgba(55,53,47,0.4);
      margin-right: 6px;
    }

    .btn-new, .btn-gear {
      background: rgba(55,53,47,0.04);
      border: none;
      cursor: pointer;
      font-family: inherit;
      height: 30px;
      padding: 0 10px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, color 0.1s;
    }
    .btn-new {
      font-size: 13px;
      font-weight: 500;
      color: rgba(55,53,47,0.65);
    }
    .btn-gear {
      color: rgba(55,53,47,0.4);
      padding: 0;
      width: 30px;
      font-size: 16px;
      line-height: 1;
    }
    .btn-new:hover, .btn-gear:hover { background: rgba(55,53,47,0.08); color: #37352f; }

    /* ── Add form ── */
    .add-form {
      background: rgba(55,53,47,0.03);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 20px;
    }

    .status-picker {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }

    .spick {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 4px;
      color: rgba(55,53,47,0.5);
      transition: background 0.1s, color 0.1s;
    }
    .spick:hover { background: rgba(55,53,47,0.08); color: #37352f; }
    .spick.sel   { background: #37352f; color: #fff; }

    .add-input {
      display: block;
      width: 100%;
      border: none;
      outline: none;
      font-size: 14px;
      font-family: inherit;
      color: #37352f;
      background: transparent;
      padding: 4px 0;
      margin-bottom: 10px;
    }
    .add-input::placeholder { color: rgba(55,53,47,0.3); }

    .add-btns { display: flex; gap: 6px; margin-top: 12px; }

    .btn-submit {
      background: #37352f;
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 4px;
      transition: background 0.1s;
    }
    .btn-submit:hover { background: #555450; }

    .btn-dismiss {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      color: rgba(55,53,47,0.5);
      padding: 5px 10px;
      border-radius: 4px;
      transition: background 0.1s, color 0.1s;
    }
    .btn-dismiss:hover { background: rgba(55,53,47,0.08); color: #37352f; }

    /* ── Sections ── */
    .section { margin-bottom: 20px; }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      margin-bottom: 2px;
      border-radius: 4px;
      cursor: default;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: rgba(55,53,47,0.5);
    }

    .section-count {
      font-size: 11px;
      color: rgba(55,53,47,0.3);
    }

    .section-empty {
      padding: 4px 6px;
      font-size: 13px;
      color: rgba(55,53,47,0.3);
    }

    .section.section-drag-over {
      outline: 2px dashed rgba(55,53,47,0.25);
      outline-offset: 2px;
      border-radius: 6px;
    }

    /* ── Items ── */
    .item {
      display: flex;
      align-items: center;
      padding: 3px 6px;
      border-radius: 4px;
      min-height: 34px;
      gap: 6px;
    }
    .item:hover { background: rgba(55,53,47,0.04); }

    .item.dragging { opacity: 0.4; }
    .item { position: relative; }
    .item.drag-over-top::before,
    .item.drag-over-bottom::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: #37352f;
      border-radius: 0;
    }
    .item.drag-over-top::before    { top: -1px; }
    .item.drag-over-bottom::after  { bottom: -1px; }

    .item-title-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
    }
    .item-title {
      font-size: 14px;
      color: #37352f;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .item-title[contenteditable] { flex: 1; outline: none; cursor: text; border-bottom: 1.5px solid rgba(55,53,47,0.3); }
    .btn-title-edit {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      color: rgba(55,53,47,0.25);
      width: 28px;
      height: 28px;
      padding: 0;
      flex-shrink: 0;
      margin-left: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      transition: background 0.1s, color 0.1s;
    }
    .btn-title-edit:hover { background: rgba(55,53,47,0.08); color: #37352f; }
    .btn-title-done {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: rgba(55,53,47,0.4);
      width: 28px;
      height: 28px;
      padding: 0;
      flex-shrink: 0;
      margin-left: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      transition: background 0.1s, color 0.1s;
    }
    .btn-title-done:hover { background: rgba(55,53,47,0.08); color: #37352f; }

    .item-btns {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .item-del {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: rgba(55,53,47,0.4);
      width: 28px;
      height: 28px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
    }
    .item-del:hover { background: rgba(235,87,87,0.1); color: #e03e3e; }

    .drag-handle {
      color: rgba(55,53,47,0.3);
      cursor: grab;
      user-select: none;
      flex-shrink: 0;
      font-size: 13px;
      line-height: 1;
    }
    .drag-handle:active { cursor: grabbing; }

    /* ── Setup ── */
    .setup-card {
      border: 1px solid rgba(55,53,47,0.12);
      border-radius: 6px;
      padding: 28px;
    }

    .setup-head {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #37352f;
    }

    .setup-desc {
      font-size: 13px;
      color: rgba(55,53,47,0.55);
      line-height: 1.65;
      margin-bottom: 24px;
    }

    .field { margin-bottom: 16px; }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: rgba(55,53,47,0.5);
      display: block;
      margin-bottom: 6px;
    }

    .field input {
      display: block;
      width: 100%;
      border: 1px solid rgba(55,53,47,0.16);
      border-radius: 4px;
      outline: none;
      font-size: 13px;
      font-family: inherit;
      color: #37352f;
      background: #fff;
      padding: 7px 10px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus {
      border-color: rgba(35,131,226,0.5);
      box-shadow: 0 0 0 3px rgba(35,131,226,0.18);
    }
    .field input::placeholder { color: rgba(55,53,47,0.3); }

    .setup-btns {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-connect {
      background: #37352f;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      padding: 7px 18px;
      transition: background 0.1s;
    }
    .btn-connect:hover { background: #555450; }

    .btn-back {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      color: rgba(55,53,47,0.5);
      padding: 7px 8px;
      border-radius: 4px;
      transition: background 0.1s, color 0.1s;
    }
    .btn-back:hover { background: rgba(55,53,47,0.08); color: #37352f; }

    .setup-msg {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.5;
    }

    .loading {
      padding: 60px 0;
      font-size: 13px;
      color: rgba(55,53,47,0.4);
    }

    /* ── Tags ── */
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
    }

    .tag-cloud-label {
      font-size: 11px;
      color: rgba(55,53,47,0.35);
      margin-right: 2px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 3px;
      background: rgba(55,53,47,0.08);
      color: rgba(55,53,47,0.65);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: background 0.1s, color 0.1s;
    }
    .tag:hover  { background: rgba(55,53,47,0.14); color: #37352f; }
    .tag.active { background: #37352f; color: #fff; }

    .item-tags {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .item-tag {
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 3px;
      background: rgba(55,53,47,0.07);
      color: rgba(55,53,47,0.55);
      white-space: nowrap;
    }
    .item-tag.active { background: #37352f; color: #fff; }

    .btn-tag-edit {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      color: rgba(55,53,47,0.25);
      width: 28px;
      height: 28px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      transition: background 0.1s, color 0.1s;
    }
    .btn-tag-edit:hover { background: rgba(55,53,47,0.08); color: #37352f; }

    @media (hover: hover) {
      .item-btns,
      .btn-tag-edit,
      .btn-title-edit,
      .drag-handle { opacity: 0; transition: opacity 0.1s; }
      .item:hover .item-btns,
      .item:hover .btn-tag-edit,
      .item:hover .btn-title-edit,
      .item:hover .drag-handle { opacity: 1; }
    }
    @media (hover: none) {
      .btn-gear { width: 44px; }
      .item-btns, .drag-handle { display: none; }
      .btn-tag-edit, .btn-title-edit { display: none; }
      .item.touch-sel .item-btns { display: flex; }
      .item.touch-sel .btn-tag-edit { display: inline-flex; }
      .item.touch-sel .btn-title-edit { display: inline-flex; }
      .item.touch-sel .drag-handle { display: inline; }
    }

    .tag-edit-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .tag-edit-input {
      border: none;
      outline: none;
      font-size: 11px;
      font-family: inherit;
      color: #37352f;
      background: rgba(55,53,47,0.06);
      border-radius: 3px;
      padding: 3px 8px;
      width: 160px;
    }

    .btn-tag-save {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: rgba(55,53,47,0.4);
      width: 28px;
      height: 28px;
      padding: 0;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      transition: background 0.1s, color 0.1s;
    }
    .btn-tag-save:hover { background: rgba(55,53,47,0.08); color: #37352f; }

    .add-tags-input {
      flex: 1;
      min-width: 60px;
      border: none;
      outline: none;
      font-size: 12px;
      font-family: inherit;
      color: #37352f;
      background: transparent;
      padding: 0;
    }
    .add-tags-input::placeholder { color: rgba(55,53,47,0.25); }

    .add-tags-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      padding: 0;
      margin-bottom: 10px;
      cursor: text;
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

const CFG_KEY = 'db_config';

const STATUSES     = ['progress', 'backlog', 'want', 'done'];
const ADD_STATUSES = ['progress', 'backlog', 'want'];
const LABELS       = { progress: 'In Progress', backlog: 'Backlog', want: 'Want', done: 'Done' };

let config      = null;
let data        = { items: [] };
let fileSha     = null;
let isAdding    = false;
let newStatus      = 'progress';
let isSaving       = false;
let needsSave      = false;
let draggedId      = null;
let activeTag      = null;
let editingTagsFor  = null;
let editingTitleFor = null;
let touchSelId      = null;

// ── Utilities ────────────────────────────────────────────────

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function b64enc(str) {
  return btoa(
    encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
      (_, hex) => String.fromCharCode(parseInt(hex, 16)))
  );
}

function b64dec(str) {
  return decodeURIComponent(
    [...atob(str)].map(c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')
  );
}

// ── GitHub API ───────────────────────────────────────────────

async function ghFetch(path, opts = {}) {
  return fetch(
    `https://api.github.com/repos/${config.owner}/${config.repo}${path}`,
    {
      cache: 'no-store',
      ...opts,
      headers: {
        Authorization: `Bearer ${config.pat}`,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json',
        ...(opts.headers || {})
      }
    }
  );
}

function normalize(d) {
  if (!d) return { items: [] };
  let items;
  if (Array.isArray(d.items)) {
    items = d.items;
  } else {
    const old = [...(d.books || []), ...(d.courses || [])];
    items = old.map(i => ({ id: i.id, title: i.title, status: i.status, addedAt: i.addedAt }));
  }
  items.forEach(i => {
    if (i.status === 'active') i.status = 'progress';
    if (!Array.isArray(i.tags)) i.tags = [];
  });
  return { items };
}

async function ghLoad() {
  const res = await ghFetch('/contents/data.json');
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const j = await res.json();
  fileSha = j.sha;
  return normalize(JSON.parse(b64dec(j.content.replace(/\s/g, ''))));
}

async function ghSave() {
  if (isSaving) { needsSave = true; return; }
  isSaving = true;
  syncMsg('saving…');
  try {
    const body = {
      message: 'update',
      content: b64enc(JSON.stringify(data, null, 2)),
      ...(fileSha ? { sha: fileSha } : {})
    };
    const res = await ghFetch('/contents/data.json', {
      method: 'PUT',
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const detail = await res.json().catch(() => ({}));
      throw new Error(`${res.status} — ${detail.message || 'unknown'}`);
    }
    const j = await res.json();
    fileSha = j.content.sha;
    syncMsg('saved');
    setTimeout(() => syncMsg(''), 2000);
  } catch (e) {
    syncMsg(`save failed: ${e.message}`);
    console.error(e);
  } finally {
    isSaving = false;
    if (needsSave) { needsSave = false; ghSave(); }
  }
}

function syncMsg(msg) {
  const el = document.querySelector('.sync-status');
  if (el) el.textContent = msg;
}

// ── Data operations ──────────────────────────────────────────

function parseTags(str) {
  return str.split(',').map(t => t.trim()).filter(Boolean);
}

function allTags() {
  const set = new Set();
  data.items.forEach(i => i.tags.forEach(t => set.add(t)));
  return [...set].sort();
}

function filterByTag(tag) {
  activeTag = activeTag === tag ? null : tag;
  render();
}

function setTags(id, str) {
  const item = data.items.find(i => i.id === id);
  if (!item) return;
  item.tags = parseTags(str);
  editingTagsFor = null;
  ghSave();
  render();
}

function startTagEdit(id) {
  editingTagsFor = id;
  render();
  const inp = document.getElementById(`tagedit-${id}`);
  if (inp) { inp.focus(); inp.select(); }
}

function cancelTagEdit() {
  editingTagsFor = null;
  render();
}

const isTouch = () => window.matchMedia('(hover: none)').matches;

function touchSelect(id, e) {
  if (!isTouch()) return;
  if (touchSelId === id) return;
  e.stopPropagation();
  if (touchSelId) document.querySelector(`.item[data-id="${touchSelId}"]`)?.classList.remove('touch-sel');
  touchSelId = id;
  document.querySelector(`.item[data-id="${id}"]`)?.classList.add('touch-sel');
}


function startTitleEdit(id) {
  editingTitleFor = id;
  editingTagsFor  = null;
  render();
}

function setTitle(id, value) {
  if (!editingTitleFor) return;
  const item = data.items.find(i => i.id === id);
  if (!item) return;
  const v = value.trim();
  if (v) item.title = v;
  editingTitleFor = null;
  ghSave();
  render();
}

function cancelTitleEdit() {
  editingTitleFor = null;
  render();
}

function toggleAddTag(tag) {
  const inp = document.getElementById('inp-tags');
  if (!inp) return;
  const tags = parseTags(inp.value);
  const idx = tags.indexOf(tag);
  if (idx >= 0) tags.splice(idx, 1);
  else tags.push(tag);
  inp.value = tags.join(', ');
  document.querySelectorAll('.add-tag-opt').forEach(el => {
    el.classList.toggle('active', tags.includes(el.dataset.tag));
  });
}

function addItem(title, status, tags) {
  data.items.unshift({ id: uid(), title: title.trim(), status, tags: tags || [], addedAt: new Date().toISOString() });
  ghSave();
  render();
}

function deleteItem(id) {
  data.items = data.items.filter(i => i.id !== id);
  ghSave();
  render();
}

function confirmDelete(btn, id) {
  if (btn.dataset.pending === '1') {
    deleteItem(id);
  } else {
    btn.dataset.pending = '1';
    btn.textContent = '×?';
    btn.style.color = '#e03e3e';
    btn.style.width = 'auto';
    btn.style.padding = '0 6px';
    setTimeout(() => {
      if (btn.dataset.pending === '1') {
        btn.dataset.pending = '';
        btn.textContent = '×';
        btn.style.color = '';
        btn.style.width = '';
        btn.style.padding = '';
      }
    }, 3000);
  }
}

function setStatus(id, status) {
  const item = data.items.find(i => i.id === id);
  if (!item || item.status === status) return;
  item.status = status;
  ghSave();
  render();
}

// ── Drag to reorder ──────────────────────────────────────────

function onDragStart(e, id) {
  draggedId = id;
  e.dataTransfer.effectAllowed = 'move';
  requestAnimationFrame(() => {
    const el = document.querySelector(`.item[data-id="${id}"]`);
    if (el) el.classList.add('dragging');
  });
}

function onDragOver(e, targetId) {
  if (!draggedId || draggedId === targetId) return;
  e.preventDefault();
  e.stopPropagation();
  const rect   = e.currentTarget.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height / 2;
  document.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(el => {
    if (el !== e.currentTarget) el.classList.remove('drag-over-top', 'drag-over-bottom');
  });
  document.querySelectorAll('.section-drag-over').forEach(el => el.classList.remove('section-drag-over'));
  e.currentTarget.classList.toggle('drag-over-top',    before);
  e.currentTarget.classList.toggle('drag-over-bottom', !before);
}

function onDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
  }
}

function onDrop(e, targetId) {
  e.preventDefault();
  e.stopPropagation();
  if (!draggedId || draggedId === targetId) return;
  const draggedItem = data.items.find(i => i.id === draggedId);
  const targetItem  = data.items.find(i => i.id === targetId);
  if (!draggedItem || !targetItem) return;
  draggedItem.status = targetItem.status;
  const rect    = e.currentTarget.getBoundingClientRect();
  const before  = e.clientY < rect.top + rect.height / 2;
  const fromIdx = data.items.findIndex(i => i.id === draggedId);
  const [dragged] = data.items.splice(fromIdx, 1);
  const toIdx   = data.items.findIndex(i => i.id === targetId);
  data.items.splice(before ? toIdx : toIdx + 1, 0, dragged);
  draggedId = null;
  ghSave();
  render();
}

function onSectionDragOver(e, status) {
  if (!draggedId) return;
  e.preventDefault();
  document.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(el =>
    el.classList.remove('drag-over-top', 'drag-over-bottom')
  );
  e.currentTarget.classList.add('section-drag-over');
}

function onSectionDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.classList.remove('section-drag-over');
  }
}

function onSectionDrop(e, status) {
  e.preventDefault();
  if (!draggedId) return;
  const item = data.items.find(i => i.id === draggedId);
  if (!item) return;
  item.status = status;
  const fromIdx = data.items.findIndex(i => i.id === draggedId);
  const [dragged] = data.items.splice(fromIdx, 1);
  data.items.push(dragged);
  draggedId = null;
  ghSave();
  render();
}

function onDragEnd() {
  draggedId = null;
  document.querySelectorAll('.dragging, .drag-over-top, .drag-over-bottom, .section-drag-over').forEach(el =>
    el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom', 'section-drag-over')
  );
}

function onTouchDragStart(e, id) {
  draggedId = id;
  document.querySelector(`.item[data-id="${id}"]`)?.classList.add('dragging');
}

function onTouchDragMove(e) {
  if (!draggedId) return;
  e.preventDefault();
  const touch = e.touches[0];
  const draggedEl = document.querySelector(`.item[data-id="${draggedId}"]`);
  if (draggedEl) draggedEl.style.visibility = 'hidden';
  const target = document.elementFromPoint(touch.clientX, touch.clientY);
  if (draggedEl) draggedEl.style.visibility = '';
  document.querySelectorAll('.item').forEach(el =>
    el.classList.remove('drag-over-top', 'drag-over-bottom')
  );
  if (!target) return;
  const item = target.closest('.item');
  if (item && item.dataset.id !== draggedId) {
    const rect = item.getBoundingClientRect();
    item.classList.add(touch.clientY < rect.top + rect.height / 2 ? 'drag-over-top' : 'drag-over-bottom');
  }
}

function onTouchDragEnd(e) {
  if (!draggedId) return;
  const touch = e.changedTouches[0];
  const draggedEl = document.querySelector(`.item[data-id="${draggedId}"]`);
  if (draggedEl) draggedEl.style.visibility = 'hidden';
  const target = document.elementFromPoint(touch.clientX, touch.clientY);
  if (draggedEl) draggedEl.style.visibility = '';
  if (target) {
    const item = target.closest('.item');
    if (item && item.dataset.id !== draggedId) {
      onDrop({ preventDefault:()=>{}, stopPropagation:()=>{}, clientY: touch.clientY, currentTarget: item }, item.dataset.id);
      return;
    }
    const section = target.closest('[data-status]');
    if (section) { onSectionDrop({ preventDefault:()=>{} }, section.dataset.status); }
  }
  onDragEnd();
}

// ── Render ───────────────────────────────────────────────────

function pickStatus(s) {
  newStatus = s;
  document.querySelectorAll('.spick').forEach(b => {
    b.classList.toggle('sel', b.dataset.s === s);
  });
}

function itemHTML(item) {
  const tagsArea = editingTagsFor === item.id
    ? `<div class="tag-edit-wrap">
         <input id="tagedit-${item.id}" class="tag-edit-input"
                value="${esc(item.tags.join(', '))}" placeholder="tag1, tag2"
                onkeydown="if(event.key==='Enter')setTags('${item.id}',this.value);if(event.key==='Escape')cancelTagEdit()">
         <button class="btn-tag-save" onmousedown="event.preventDefault()" onclick="setTags('${item.id}',document.getElementById('tagedit-${item.id}').value)">✓</button>
       </div>`
    : `<div class="item-tags">
         ${item.tags.map(t => `<span class="item-tag${activeTag===t?' active':''}">${esc(t)}</span>`).join('')}
         <button class="btn-tag-edit" onclick="startTagEdit('${item.id}')">#</button>
       </div>`;

  return `
    <div class="item" data-id="${item.id}"
         onclick="touchSelect('${item.id}',event)"
         ondragover="onDragOver(event,'${item.id}')"
         ondragleave="onDragLeave(event)"
         ondrop="onDrop(event,'${item.id}')"
         ondragend="onDragEnd()">
      ${editingTitleFor === item.id
        ? `<div class="item-title-wrap"><span id="titleedit-${item.id}" class="item-title" contenteditable="true" spellcheck="false"
                  onkeydown="if(event.key==='Enter'){event.preventDefault();setTitle('${item.id}',this.textContent.trim());}if(event.key==='Escape')cancelTitleEdit();"
                  onblur="setTitle('${item.id}',this.textContent.trim())">${esc(item.title)}</span><button class="btn-title-done" onmousedown="event.preventDefault()" onclick="setTitle('${item.id}',document.getElementById('titleedit-${item.id}').textContent.trim())">✓</button></div>`
        : `<div class="item-title-wrap"><span class="item-title">${esc(item.title)}</span><button class="btn-title-edit" onclick="startTitleEdit('${item.id}')">✎</button></div>`}
      ${tagsArea}
      <div class="item-btns">
        <button class="item-del" onclick="confirmDelete(this,'${item.id}')">×</button>
      </div>
      <span class="drag-handle" draggable="true"
            ondragstart="onDragStart(event,'${item.id}')"
            ontouchstart="onTouchDragStart(event,'${item.id}')"
            ontouchmove="onTouchDragMove(event)"
            ontouchend="onTouchDragEnd(event)">⠿</span>
    </div>`;
}

function sectionHTML(status) {
  const items = data.items.filter(i => i.status === status && (!activeTag || i.tags.includes(activeTag)));
  return `
    <div class="section" data-status="${status}"
         ondragover="onSectionDragOver(event,'${status}')"
         ondragleave="onSectionDragLeave(event)"
         ondrop="onSectionDrop(event,'${status}')">
      <div class="section-head">
        <span class="section-title">${LABELS[status]}</span>
        <span class="section-count">${items.length}</span>
      </div>
      ${items.length
        ? items.map(itemHTML).join('')
        : `<div class="section-empty">Nothing here yet.</div>`}
    </div>`;
}

function addFormHTML() {
  return `
    <div class="add-form">
      <div class="status-picker">
        ${ADD_STATUSES.map(s => `
          <button class="spick${s === newStatus ? ' sel' : ''}" data-s="${s}" onclick="pickStatus('${s}')">${LABELS[s]}</button>
        `).join('')}
      </div>
      <input id="inp-title" class="add-input" type="text" placeholder="Title" autocomplete="off" spellcheck="false">
      <div class="add-tags-row" onclick="document.getElementById('inp-tags').focus()">
        ${allTags().map(tag=>`<span class="tag add-tag-opt" data-tag="${esc(tag)}" onclick="toggleAddTag('${esc(tag)}')">${esc(tag)}</span>`).join('')}
        <input id="inp-tags" class="add-tags-input" type="text" placeholder="Tags" autocomplete="off" spellcheck="false">
      </div>
      <div class="add-btns">
        <button class="btn-submit" onclick="submitAdd()">Add</button>
        <button class="btn-dismiss" onclick="cancelAdd()">Cancel</button>
      </div>
    </div>`;
}

function render() {
  const title = (config && config.title) || 'Dashboard';
  document.title = title;
  document.getElementById('app').innerHTML = `
    <header>
      <span class="site-title">${esc(title)}</span>
      <div class="header-right">
        <span class="sync-status"></span>
        <button class="btn-new" onclick="startAdd()">+ New</button>
        <button class="btn-gear" onclick="document.querySelector('.setup-card') ? render() : showSetup()" title="settings">⚙</button>
      </div>
    </header>
    ${isAdding ? addFormHTML() : ''}
    ${(()=>{
      const tags = allTags();
      if (!tags.length) return '';
      return `<div class="tag-cloud">
        <span class="tag-cloud-label">Tags</span>
        ${tags.map(t => `<span class="tag${activeTag===t?' active':''}" onclick="filterByTag('${esc(t)}')">${esc(t)}</span>`).join('')}
      </div>`;
    })()}
    ${STATUSES.map(sectionHTML).join('')}`;

  if (isAdding) {
    const inp    = document.getElementById('inp-title');
    const tagInp = document.getElementById('inp-tags');
    inp.focus();
    [inp, tagInp].forEach(el => el && el.addEventListener('keydown', e => {
      if (e.key === 'Enter')  submitAdd();
      if (e.key === 'Escape') cancelAdd();
    }));
  }

  if (editingTagsFor) {
    const inp = document.getElementById(`tagedit-${editingTagsFor}`);
    if (inp) { inp.focus(); inp.select(); }
  }

  if (editingTitleFor) {
    const el = document.getElementById(`titleedit-${editingTitleFor}`);
    if (el) {
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  if (touchSelId) {
    document.querySelector(`.item[data-id="${touchSelId}"]`)?.classList.add('touch-sel');
  }
}

function startAdd() {
  isAdding = true;
  render();
}

function submitAdd() {
  const inp    = document.getElementById('inp-title');
  const tagInp = document.getElementById('inp-tags');
  const title  = inp ? inp.value.trim() : '';
  const tags   = tagInp ? parseTags(tagInp.value) : [];
  isAdding = false;
  if (title) addItem(title, newStatus, tags);
  else render();
}

function cancelAdd() {
  isAdding = false;
  render();
}

// ── Setup screen ─────────────────────────────────────────────

function showSetup() {
  const c = config || {};
  const title = c.title || 'Dashboard';
  document.title = title;
  document.getElementById('app').innerHTML = `
    <header>
      <span class="site-title">${esc(title)}</span>
      <div class="header-right">
        <button class="btn-gear" onclick="document.querySelector('.setup-card') ? render() : showSetup()" title="settings">⚙</button>
      </div>
    </header>
    <div class="setup-card">
      <div class="setup-head">Setup</div>
      <p class="setup-desc">
        Create a private GitHub repo for your data, then enter your credentials below.
        Your PAT is saved only in this browser.
      </p>
      <div class="field">
        <label class="field-label" for="s-title">Title</label>
        <input id="s-title" type="text" value="${esc(c.title || '')}" placeholder="Dashboard">
      </div>
      <div class="field">
        <label class="field-label" for="s-pat">GitHub PAT</label>
        <input id="s-pat" type="password" value="${esc(c.pat || '')}" placeholder="ghp_…" autocomplete="off">
      </div>
      <div class="field">
        <label class="field-label" for="s-owner">GitHub username</label>
        <input id="s-owner" type="text" value="${esc(c.owner || '')}" placeholder="username">
      </div>
      <div class="field">
        <label class="field-label" for="s-repo">Data repo name</label>
        <input id="s-repo" type="text" value="${esc(c.repo || '')}" placeholder="my-data">
      </div>
      <div class="setup-btns">
        <button class="btn-connect" onclick="saveSetup()">Save</button>
        ${config ? `<button class="btn-back" onclick="render()">Cancel</button>` : ''}
      </div>
      <div class="setup-msg" id="setup-msg"></div>
    </div>`;

  document.getElementById('s-title').focus();
  ['s-title','s-pat','s-owner','s-repo'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') saveSetup(); });
  });
}

async function saveSetup() {
  const titleVal = document.getElementById('s-title').value.trim();
  const pat      = document.getElementById('s-pat').value.trim();
  const owner    = document.getElementById('s-owner').value.trim();
  const repo     = document.getElementById('s-repo').value.trim();
  const msgEl = document.getElementById('setup-msg');

  if (!pat || !owner || !repo) {
    msgEl.style.color = '#c00';
    msgEl.textContent = 'All fields required.';
    return;
  }

  msgEl.style.color = '#666';
  msgEl.textContent = 'Connecting…';

  try {
    const res = await fetch(
      `https://api.github.com/repos/${owner}/${repo}`,
      { headers: { Authorization: `Bearer ${pat}`, Accept: 'application/vnd.github+json' } }
    );
    if (res.status === 401) { msgEl.style.color = '#c00'; msgEl.textContent = 'Invalid PAT.'; return; }
    if (res.status === 404) { msgEl.style.color = '#c00'; msgEl.textContent = 'Not found or no access — GitHub returns 404 for private repos the token cannot see. Ensure the PAT has Contents: read/write on this repo.'; return; }
    if (!res.ok)            { msgEl.style.color = '#c00'; msgEl.textContent = `Error: HTTP ${res.status}`; return; }
  } catch {
    msgEl.style.color = '#c00';
    msgEl.textContent = 'Network error.';
    return;
  }

  config = { pat, owner, repo, title: titleVal || 'Dashboard' };
  localStorage.setItem(CFG_KEY, JSON.stringify(config));
  await init();
}

// ── Init ─────────────────────────────────────────────────────

async function init() {
  try { config = JSON.parse(localStorage.getItem(CFG_KEY)); } catch { config = null; }

  if (!config) { showSetup(); return; }

  document.getElementById('app').innerHTML = '<div class="loading">Loading…</div>';

  try {
    const fresh = await ghLoad();
    data = fresh !== null ? fresh : { items: [] };
    render();
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<div class="loading">Failed to load: ${esc(e.message)}<br><br><button class="btn-submit" onclick="showSetup()">Settings</button></div>`;
  }
}

init();

document.addEventListener('click', e => {
  if (touchSelId && !e.target.closest(`.item[data-id="${touchSelId}"]`)) {
    document.querySelector(`.item[data-id="${touchSelId}"]`)?.classList.remove('touch-sel');
    touchSelId = null;
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
